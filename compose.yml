services:
  workbench:
    # platform: linux/amd64  # Uncomment ONLY if necessary
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: workbench
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8888:8888"
    volumes:
      - ./work:/work
    working_dir: /work
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --notebook-dir=/work/notebooks
      --NotebookApp.token=
      --NotebookApp.password=

  runner:
    # platform: linux/amd64  # Uncomment ONLY if necessary
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./work:/work
    working_dir: /work
    entrypoint: ["micromamba", "run", "-n", "geo"]
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      MAMBA_PKGS_DIRS: /tmp/.mamba/pkgs
      CONDA_PKGS_DIRS: /tmp/.mamba/pkgs